# Optional: deploy to GitHub Pages. Cloudflare Pages is the recommended primary
# target (unmetered bandwidth); see docs/DEPLOY.md for the trade-off.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Strict: fail rather than deploy a site whose Translator cannot start.
      - name: Fetch MediaPipe assets
        run: npm run setup:assets

      - name: Build
        run: npm run build
        env:
          # A GitHub Pages *project* site is served from /<repo>/. Must match the
          # repository name, with both slashes. Remove for a user site or a custom
          # domain at the root.
          BASE_PATH: /eye/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
