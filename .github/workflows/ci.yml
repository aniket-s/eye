name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Public repositories get unlimited free minutes on standard runners.
# Do not switch to larger runners — those are billed even for public repos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  training:
    name: Training pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install training dependencies
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu &&
          pip install -e "training[dev]" onnx onnxruntime onnxscript
          opencv-python-headless

      # Regenerate the parity fixtures from TypeScript, then assert Python matches.
      # This is the guard against train/inference skew: change one normaliser without
      # the other and the build fails here.
      - name: Regenerate parity fixtures
        run: npm run fixtures:parity

      - name: Fail if fixtures drifted
        run: git diff --exit-code training/fixtures/

      - name: Run training tests
        run: cd training && python -m pytest -q

      # The dictionary diagrams are generated, so a change to the hand model must
      # regenerate them rather than leave the committed art stale.
      - name: Regenerate dictionary diagrams
        run: npm run diagrams

      - name: Fail if diagrams drifted
        run: git diff --exit-code packages/web/public/alphabets packages/web/public/numbers

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch MediaPipe assets
        run: npm run setup:assets

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Strict: a release must never ship without its vision models.
      - name: Fetch MediaPipe assets
        run: npm run setup:assets

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h -d1 packages/web/dist >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: packages/web/dist/
          retention-days: 7
