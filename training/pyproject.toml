[project]
name = "mudra-train"
version = "0.1.0"
description = "Training pipeline for MudraPragyan.AI sign recognition models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mudra_train*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
